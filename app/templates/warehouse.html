{% extends "base.html" %}
{% set page = "warehouse" %}
{% set title = "仓库 - 皮埃尔商店" %}
{% block content %}
<header class="page-head">
  <div>
    <p class="eyebrow">Warehouse</p>
    <h1>独立仓库</h1>
  </div>
  <div class="toolbar">
    <select id="seasonFilter">
      <option value="">全部季节</option>
      <option value="春季">春季</option>
      <option value="夏季">夏季</option>
      <option value="秋季">秋季</option>
    </select>
    <input id="searchInput" placeholder="筛选仓库种子">
  </div>
</header>
<section id="inventoryGrid" class="seed-grid"></section>
{% endblock %}
